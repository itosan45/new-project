name: Android build (companion-android)

on:
  push:
    paths:
      - "companion-android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: companion-android
        env:
          COMPANION_API_BASE_URL: ${{ secrets.COMPANION_API_BASE_URL }}
          COMPANION_SHARED_SECRET: ${{ secrets.COMPANION_SHARED_SECRET }}
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PcompanionApiBaseUrl="$COMPANION_API_BASE_URL" \
            -PcompanionSharedSecret="$COMPANION_SHARED_SECRET"

      - uses: actions/upload-artifact@v4
        with:
          name: companion-wakeup-debug-apk
          path: companion-android/app/build/outputs/apk/debug/app-debug.apk
