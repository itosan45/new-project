# どの項目を、Excelのどの列に入れるかの設定ファイル
#
# このファイルを書き換えるだけで、抽出する項目や入れる列を変えられます。
# プログラム本体はさわらなくて大丈夫です。

# 出力するExcelファイルの名前
出力ファイル: 抽出結果.xlsx

# シート名
シート名: 抽出データ

# 1行目を見出しにするか
見出し行をつける: true

# 抽出する項目の定義
#
# 列    : Excelの列(A, B, C ...)
# 見出し: 1行目に表示する名前
# 種類  : 何を抜き出すか。以下から選ぶ
#           ファイル名 … 元の画像ファイル名
#           日付       … 文書内の日付
#           金額       … 「¥1,234」「1,234円」などの金額
#           電話番号   … 電話番号
#           全文       … 読み取った文字すべて
#           キーワード … 指定した言葉の右または下にある値(下の「手がかり」で指定)
#
# 手がかり: 種類が「キーワード」のときだけ使う。この言葉の近くの値を拾う

項目:
  - 列: A
    見出し: ファイル名
    種類: ファイル名

  - 列: B
    見出し: 日付
    種類: 日付

  - 列: C
    見出し: 金額
    種類: 金額

  - 列: D
    見出し: 宛名
    種類: キーワード
    手がかり: [宛名, 様, お名前, 氏名]

  - 列: E
    見出し: 電話番号
    種類: 電話番号

  - 列: F
    見出し: 読み取り全文
    種類: 全文
